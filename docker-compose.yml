name: kitty-love

services:
  postgres:
    image: pgvector/pgvector@sha256:18d16372b8406bb38a9f94cbff15d125c463d71fde2770aa8b5c64bfcc1578ee
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kitty_love_db}
      POSTGRES_USER: ${POSTGRES_USER:-kitty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${SITE_TIMEZONE:-Asia/Shanghai}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-35432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kitty} -d ${POSTGRES_DB:-kitty_love_db}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "${MINIO_BIND_HOST:-127.0.0.1}:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - default
      - skill-internal

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/pet-assets
        mc mb --ignore-existing local/user-uploads
        mc mb --ignore-existing local/skill-packages
        mc mb --ignore-existing local/derived-assets
        mc mirror --overwrite /seed/pet-assets local/pet-assets
        mc anonymous set download local/pet-assets
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - ./public/pet-assets:/seed/pet-assets:ro

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command:
      - /bin/sh
      - -ec
      - |
        python -m app.migration_bootstrap
        alembic upgrade head
        python -m app.queue_schema
        # 两个账号是双人功能（聊天、每日一问）的前置条件。只在开发环境自动补，
        # 生产用 `python -m app.cli create-user` 手工建，别让默认密码流到线上。
        if [ "$${APP_ENV:-development}" = "development" ]; then
          python -m app.cli seed-users
        fi
    environment: &backend-environment
      APP_ENV: ${APP_ENV:-development}
      # 容器默认跑在 UTC，而 procrastinate 的 cron 是按**进程本地时区**算的
      # （croniter 拿 epoch 秒走 datetime.fromtimestamp，不带 tz）。不设这个，
      # `7 1 * * *`（写着「凌晨 1:07 跑，不跟用户抢」）在东八区实际是早上 9:07，
      # 而 `*/20 8-22 * * *`（写着「只在白天送，深夜不打扰」）实际是下午四点到
      # 第二天凌晨六点——注释和行为正好相反。
      # 应用代码里的「今天」「深夜」另有 SITE_TIMEZONE 管，见 app/localtime.py；
      # 两者要一起改，不要只改一个。
      TZ: ${SITE_TIMEZONE:-Asia/Shanghai}
      SITE_TIMEZONE: ${SITE_TIMEZONE:-Asia/Shanghai}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-kitty}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-kitty_love_db}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      # Passkey。**这两个必须跟着域名走。**
      #
      # RP ID 要和浏览器地址栏里的域名逐字一致，ORIGINS 要带协议（和非默认
      # 端口）。配错**不会报错**，只会在按指纹时弹窗一闪而过、什么都不发生，
      # 控制台也未必说清楚——所以默认值只对本地开发有效，生产必须在 .env 里
      # 显式写上，见 backend/app/passkeys.py 顶部那段。
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-http://localhost:3000}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_SECURE: "false"
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-false}
      MINIO_USER_BUCKET: user-uploads
      CHAT_MODEL: ${CHAT_MODEL:-qwen3.6-flash}
      CHAT_BASE_URL: ${CHAT_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      CHAT_API_KEY: ${CHAT_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v4}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSIONS: "1024"
      # 上下文预算。**这三个以前只写在 .env 里，从没传进容器**——改了不报错、
      # 也不生效，而默认值恰好等于当时 .env 里的值，所以一直没人发现。
      # 换模型之后再去调 .env 就会白调。
      CHAT_CONTEXT_TOKENS: ${CHAT_CONTEXT_TOKENS:-256000}
      CHAT_COMPACT_AT: ${CHAT_COMPACT_AT:-0.75}
      CHAT_COMPACT_KEEP_MESSAGES: ${CHAT_COMPACT_KEEP_MESSAGES:-20}
      SKILL_BUCKET: skill-packages
      SKILL_WORKER_URL: http://skill-worker:8010
      SKILL_WORKER_TOKEN: ${SKILL_WORKER_TOKEN:?Set SKILL_WORKER_TOKEN in .env}
      SKILL_CATALOG_URL: ${SKILL_CATALOG_URL:-https://skills.sh}
      SKILL_CATALOG_TOKEN: ${SKILL_CATALOG_TOKEN:-}
      MCP_MAX_TOOLS: ${MCP_MAX_TOOLS:-200}
      MCP_MAX_CATALOG_BYTES: ${MCP_MAX_CATALOG_BYTES:-2097152}
      # 调用方据此算自己的 HTTP 超时（脚本超时 + 10 秒）。以前只传给了
      # skill-worker 自己：worker 端按默认 30 秒算，40 秒就放弃，而 skill-worker
      # 那头还在老老实实跑到 60 秒——落在中间的脚本，执行着执行着客户端先断了。
      SKILL_SCRIPT_TIMEOUT: ${SKILL_SCRIPT_TIMEOUT:-30}
      # 同源部署时用不上，但 Tauri 桌面端要靠它。留空即只允许本地开发那个源。
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # 联网搜索。不填 key 时 web_search 工具不会注册，其余功能不受影响。
      # 可选提供方：bocha（国内直连）/ tavily / brave
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-bocha}
      WEB_SEARCH_API_KEY: ${WEB_SEARCH_API_KEY:-}
      # 文档理解/渲染只允许走服务器端服务，客户端不带运行时。
      #
      # 当前 2C4G 生产机不运行 Docling/Gotenberg，所以默认留空；以后 Mac mini
      # NAS 用 docker-compose.document.yml 启动文档栈，再把这里指向 NAS 的
      # Tailscale/WireGuard 私网地址。不要把 5001/3000 直接暴露到公网。
      DOCUMENT_PARSER_URL: "${DOCUMENT_PARSER_URL:-}"
      DOCUMENT_PARSER_API_KEY: "${DOCUMENT_PARSER_API_KEY:-}"
      DOCUMENT_RENDERER_URL: "${DOCUMENT_RENDERER_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment: *backend-environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - default
      - skill-internal

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: procrastinate --app=app.worker.procrastinate_app worker --queues=companion
    environment: *backend-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    restart: unless-stopped
    # **worker 也必须上 skill-internal。**
    #
    # 不写 networks 时只会落在 default 上，而 skill-worker 只在 skill-internal
    # 上——于是 worker 里所有指向 `http://skill-worker:8010` 的调用都是
    # 「Temporary failure in name resolution」。这不是假想：生产日志里每天
    # 凌晨 3:41 的 workspace.cleanup 从上线起就没成功过一次（工作区因此只增
    # 不减，直到撞上 64MB 上限把宠物的写入卡死），而且 worker 里跑的 ASSIST
    # 角色带着全套 workspace 工具，@宠物 时只要它去碰工作区就同样失败。
    # api 一直是对的（两个网络都在），所以这个问题只在后台任务里露头。
    networks:
      - default
      - skill-internal

  skill-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    command: uvicorn app.skill_worker:app --host 0.0.0.0 --port 8010
    user: "65534:65534"
    environment:
      APP_ENV: ${APP_ENV:-development}
      MINIO_ENDPOINT: minio:9000
      # skill-worker 只用内网客户端取对象，从不签名，所以这个值实际用不到。
      # 但别写死 localhost：一旦哪天它需要签一个 URL，配上 MINIO_PUBLIC_SECURE
      # 就会签出 `https://localhost:9000/…` 这种谁也访问不到的地址。
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_SECURE: "false"
      MINIO_PUBLIC_SECURE: ${MINIO_PUBLIC_SECURE:-false}
      SKILL_BUCKET: skill-packages
      SKILL_WORKER_CACHE_DIR: /tmp/kitty-skill-worker-cache
      SKILL_WORKER_TOKEN: ${SKILL_WORKER_TOKEN:?Set SKILL_WORKER_TOKEN in .env}
      SKILL_MAX_ARCHIVE_BYTES: "10485760"
      SKILL_MAX_EXPANDED_BYTES: "52428800"
      SKILL_MAX_FILE_BYTES: "5242880"
      SKILL_MAX_FILES: "500"
      SKILL_MAX_OUTPUT_BYTES: "1048576"
      SKILL_SCRIPT_TIMEOUT: ${SKILL_SCRIPT_TIMEOUT:-30}
      WORKSPACE_DIR: /workspace
      WORKSPACE_MAX_BYTES: ${WORKSPACE_MAX_BYTES:-67108864}
      WORKSPACE_RETENTION_DAYS: ${WORKSPACE_RETENTION_DAYS:-14}
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    volumes:
      # 宠物的工作目录。**不能用 tmpfs**：那是它自己写的东西，重启要还在。
      # 总量在应用层拦（workspace.py），Docker 卷本身没有好用的配额。
      - workspace-data:/workspace
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8010/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - skill-internal

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        API_INTERNAL_URL: http://api:8000
        PET_ASSET_INTERNAL_URL: http://minio:9000
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-}
        NEXT_PUBLIC_EVENT_BASE_URL: ${NEXT_PUBLIC_EVENT_BASE_URL:-}
        # 构建期变量：改了必须重建镜像，重启容器不生效
        NEXT_PUBLIC_AMAP_KEY: ${NEXT_PUBLIC_AMAP_KEY:-}
    environment:
      NODE_ENV: production
      API_INTERNAL_URL: http://api:8000
      # 安全密钥是**运行时**变量，只在服务端用（代理往高德转发时拼上去），
      # 所以不进 build args，也不带 NEXT_PUBLIC_ 前缀——那样会被打进前端包。
      AMAP_SECURITY_JS_CODE: ${AMAP_SECURITY_JS_CODE:-}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  workspace-data:

networks:
  skill-internal:
    internal: true
