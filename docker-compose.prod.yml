# 生产覆盖层：
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env …
#
# 做两件事。
#
# **一、把对外暴露的端口收回到回环。** 基础 compose 里 web 映射的是
# `3000:3000`，绑在所有网卡上——那是为本地开发方便。生产前面站着 Caddy，
# 公网只该经由 443 进来：直连 3000 会绕过 TLS，也绕过 Caddy 的访问日志。
# （api 的 8000 本来就只绑回环，不用改。）
#
# **二、给后端四个服务传 APT 镜像站。** 它们都从 Dockerfile.backend 构建，
# 每个都要跑一次 `apt-get update`。从境内直连 deb.debian.org 拉那 8.8MB 的
# Packages 索引慢得离谱，四个服务就是四遍。值从 .env 的 APT_MIRROR 来，留空
# 则走官方源——镜像站的可达性取决于构建机在哪（腾讯云内网那个域名出了腾讯云
# 就解析不了），所以不能写死在 Dockerfile 里。
#
# 顺带给所有长期运行的服务加上 restart: always。migrate 是一次性任务，不加。

x-apt-mirror: &apt-mirror
  build:
    args:
      APT_MIRROR: ${APT_MIRROR:-}
      PYPI_INDEX: ${PYPI_INDEX:-}

services:
  web:
    # **`!override` 不能省。** Compose 合并多个文件时，`ports` 是**追加**而不是
    # 替换——不加这个标签，生效配置里会同时存在 `0.0.0.0:3000` 和
    # `127.0.0.1:3000` 两条，同一个容器绑两次同一个端口，第二次直接
    # 「address already in use」。而报错信息指向端口被占，会把人引去查别的进程，
    # 其实系统层根本没人占（ss / lsof / docker-proxy 全查不到）。
    ports: !override
      - "127.0.0.1:3000:3000"
    restart: always
    # 旧站的上传文件。数据库里 `Photo.url` 存的是 `/uploads/xxx.jpg` 这种旧路径
    # （新库刻意保留了这一列，见 models.py 里 legacy_url 的注释），文件不挂进来
    # 的话那 29 张照片全是裂图。只读挂载——新上传走 MinIO，这批是历史遗留。
    volumes:
      - ${LEGACY_UPLOADS:-./legacy-uploads}:/app/public/uploads:ro

  postgres:
    restart: always

  minio:
    restart: always

  migrate:
    <<: *apt-mirror

  api:
    <<: *apt-mirror
    restart: always

  worker:
    <<: *apt-mirror
    restart: always

  skill-worker:
    <<: *apt-mirror
    restart: always
