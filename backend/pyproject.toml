[project]
name = "kitty-love-backend"
version = "0.1.0"
description = "Private companion service backend for Kitty Love Site"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "asyncpg>=0.30.0",
  "cuid2>=2.0.1",
  "fastapi>=0.116.0",
  "langchain>=1.0.0",
  "langchain-openai>=1.0.0",
  "langgraph-checkpoint-postgres>=3.0.0",
  "httpx>=0.28.1",
  # 后台里改的 API Key 要加密落库（见 app/runtime_config.py）。
  # 不手搓：这块要的是认证加密，自己拼 HMAC-CTR 容易在细节上出事。
  "cryptography>=45.0.0",
  "minio>=7.2.15",
  "openpyxl>=3.1.5",
  "pillow>=11.3.0",
  "pgvector>=0.4.1",
  "procrastinate>=3.5.2",
  "psycopg[binary,pool]>=3.2.9",
  "pydantic-settings>=2.10.0",
  "pwdlib[argon2]>=0.2.1",
  "python-multipart>=0.0.20",
  "python-docx>=1.2.0",
  "python-pptx>=1.0.2",
  "pypdf>=5.8.0",
  "pyyaml>=6.0.2",
  "sqlalchemy[asyncio]>=2.0.41",
  "skills-ref @ git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref",
  "uvicorn[standard]>=0.35.0",
  # Passkey（WebAuthn）。**不手写**：CBOR 解码、challenge 校验、签名验证这几处
  # 很容易错得很隐蔽，而错了的表现是「看起来能登」。
  "webauthn>=2.5.0",
  "langmem==0.0.30",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
