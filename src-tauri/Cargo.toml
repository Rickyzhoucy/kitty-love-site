[package]
name = "kitty-love-desktop"
version = "0.1.0"
description = "Kitty Love desktop companion shell"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
keyring = "3.6"
# `tray-icon` 是托盘的开关，不开这个 TrayIconBuilder 根本编译不出来。
# 托盘不是装饰——主窗口收起、宠物又锁定之后，它是唯一还能操作的入口。
# `tray-icon`：托盘。
# `macos-private-api`：macOS 上的透明窗口。**必须和 tauri.conf.json 的
#   macOSPrivateApi 同时开**，只开一边构建脚本会直接报错。
#   代价是用了私有 API 的包上不了 Mac App Store——这个站是私人分发，无所谓。
tauri = { version = "2.9", features = ["tray-icon", "macos-private-api"] }
# 选文件夹用系统原生对话框。**不能让用户手打路径**——
# 打错一个字的后果是「授权了一个不存在的目录」，然后宠物说读不到，
# 而人完全看不出是路径写错了。原生选择器选出来的一定存在。
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 本地文件当附件时要经 IPC 传字节，base64 是网页层能直接收的形式。
base64 = "0.22"
url = "2.5"

[features]
custom-protocol = ["tauri/custom-protocol"]
