[[permission]]
identifier = "allow-save-device-token"
description = "Stores the device session token in the operating-system credential vault."
commands.allow = ["save_device_token"]

[[permission]]
identifier = "allow-load-device-token"
description = "Loads the device session token from the operating-system credential vault."
commands.allow = ["load_device_token"]

[[permission]]
identifier = "allow-delete-device-token"
description = "Removes the device session token from the operating-system credential vault."
commands.allow = ["delete_device_token"]

# 桌面偏好（锁定 / 置顶 / 开机自启 / 宠物大小）。只影响本机窗口行为，
# 不碰站点数据。
[[permission]]
identifier = "allow-desktop-settings"
description = "Reads and updates desktop-only window preferences."
commands.allow = ["get_desktop_settings", "update_desktop_settings"]

# 从宠物窗口把主界面叫回来。宠物窗口无边框、没有系统按钮，
# 这是它唯一能打开主界面的路。
[[permission]]
identifier = "allow-window-control"
description = "Shows the main window and remembers where the pet window was dragged to."
commands.allow = ["show_main_window", "remember_pet_position", "set_pet_ready"]

# 服务器地址。给打包进来的本地设置页用——那一页是「连不上服务器时」唯一
# 还能打开的东西，所以它的命令不能依赖任何远端资源。
[[permission]]
identifier = "allow-server-url"
description = "Reads and updates the self-hosted server address from the bundled setup page."
commands.allow = ["get_server_url", "save_server_url", "close_setup_window"]
